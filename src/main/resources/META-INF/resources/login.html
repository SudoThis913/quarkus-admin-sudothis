<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudoThis Admin — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <div class="card shadow-sm" style="width:360px">
        <div class="card-body p-4">
            <h5 class="card-title text-center mb-1 fw-bold" style="color:#1a1f36">SudoThis Admin</h5>
            <p class="text-center text-muted mb-4" style="font-size:.85rem">Development (H2) Mode</p>
            <form method="post" action="/j_security_check">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="j_username" class="form-control" autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="j_password" class="form-control" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
