<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { display: flex; min-height: 100vh; }
        #sidebar { width: 250px; flex-shrink: 0; background-color: #f8f9fa; border-right: 1px solid #dee2e6; }
        #content { flex-grow: 1; padding: 20px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1055; }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <nav id="sidebar" class="p-3">
        <h4 class="mb-4">Admin Resources</h4>
        <ul class="nav flex-column" id="admin-nav">
            {#for def in entityDefinitions}
            <li class="nav-item">
                <a class="nav-link" href="/admin/{def.name}" hx-get="/admin/{def.name}" hx-target="#main-content" hx-swap="outerHTML">
                    {def.displayName}
                </a>
            </li>
            {/for}
        </ul>
    </nav>
    <div id="content">
        <div id="main-content">
            <h1>Welcome to the Admin Dashboard</h1>
            <p>Select a resource from the sidebar to manage it.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.body.addEventListener("showMessage", function(evt){
            const message = evt.detail.value;
            const toastContainer = document.getElementById('toastContainer');
            const toastHtml = `
                <div class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                  <div class="d-flex">
                    <div class="toast-body">
                      ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                  </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            const toastEl = toastContainer.lastElementChild;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        });
        
        document.body.addEventListener("showError", function(evt){
            const message = evt.detail.value;
            const toastContainer = document.getElementById('toastContainer');
            const toastHtml = `
                <div class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
                  <div class="d-flex">
                    <div class="toast-body">
                      ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                  </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            const toastEl = toastContainer.lastElementChild;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        });
    </script>
</body>
</html>
