<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudoThis Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/htmx.min.js"></script>
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: #f0f2f5; }
        #topbar { background: #1a1f36; color: #fff; padding: 0 1.25rem; height: 52px;
                  display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        #topbar h5 { margin: 0; font-weight: 600; letter-spacing: .02em; }
        #topbar .badge-pill { font-size: .7rem; }
        #shell { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 220px; flex-shrink: 0; background: #fff;
                   border-right: 1px solid #dee2e6; overflow-y: auto; padding: 1rem 0; }
        #sidebar .section-label { font-size: .7rem; font-weight: 700; text-transform: uppercase;
                                   letter-spacing: .08em; color: #6c757d; padding: .4rem 1rem; }
        #sidebar .nav-link { padding: .45rem 1rem; color: #343a40; border-radius: 0;
                              font-size: .88rem; display: flex; align-items: center; gap: .5rem; }
        #sidebar .nav-link:hover { background: #f0f2f5; color: #1a1f36; }
        #sidebar .nav-link.active { background: #e8f0fe; color: #1967d2; font-weight: 600; }
        #content { flex: 1; overflow-y: auto; padding: 1.5rem; }
        #main-content { background: #fff; border-radius: .5rem;
                         border: 1px solid #dee2e6; min-height: 200px; padding: 1.5rem; }
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 1055; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div id="topbar">
        <h5>SudoThis Admin</h5>
        <span class="badge bg-warning text-dark badge-pill htmx-indicator" id="loading-badge">Loading…</span>
        <div class="dropdown ms-auto">
            <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button"
                    id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                👤 {currentUser}
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                <li><h6 class="dropdown-header">{currentUser}</h6></li>
                <li><a class="dropdown-item" href="/account">Account settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="/logout">Sign out</a></li>
            </ul>
        </div>
    </div>

    <div id="shell">
        <nav id="sidebar">
            <div class="section-label">Entities</div>
            <ul class="nav flex-column" id="admin-nav">
                {#for def in entityDefinitions}
                <li class="nav-item">
                    <a class="nav-link"
                       href="/admin/{def.name}"
                       hx-get="/admin/{def.name}"
                       hx-target="#main-content"
                       hx-swap="innerHTML"
                       hx-indicator="#loading-badge"
                       hx-push-url="true">
                        {def.displayName}
                    </a>
                </li>
                {/for}
            </ul>
        </nav>

        <div id="content">
            <div id="main-content">
                <div class="text-center py-5 text-muted">
                    <h4>Welcome to SudoThis Admin</h4>
                    <p>Select an entity from the sidebar to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin.js"></script>
</body>
</html>
