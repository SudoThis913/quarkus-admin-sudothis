<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudoThis Admin - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            flex-direction: column;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .console-output {
            margin-top: 20px;
            background-color: #333;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            text-align: left;
            font-family: monospace;
            width: 80%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to SudoThis Admin</h1>
        <p class="lead">Your compliance-first, metadata-driven administration framework.</p>
        <a href="/admin" class="btn btn-primary btn-lg">Go to Admin Panel</a>
    </div>

    <div class="console-output">
        <pre id="consoleLog"></pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const consoleLog = document.getElementById('consoleLog');
            
            // Expected Site Name
            consoleLog.innerHTML += `System: SudoThis Admin\n`;
            consoleLog.innerHTML += `Environment: ${window.location.hostname === 'localhost' ? 'Development' : 'Production'}\n`;

            // Server Uptime (Requires a backend endpoint)
            // For now, client-side approximate uptime
            const startTime = new Date();
            function updateUptime() {
                const now = new Date();
                const diff = now.getTime() - startTime.getTime();
                const seconds = Math.floor(diff / 1000);
                const minutes = Math.floor(seconds / 60);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);

                const uptimeStr = `${days}d ${hours % 24}h ${minutes % 60}m ${seconds % 60}s`;
                consoleLog.innerHTML = `System: SudoThis Admin\nEnvironment: ${window.location.hostname === 'localhost' ? 'Development' : 'Production'}\nClient Uptime: ${uptimeStr}`;
            }
            setInterval(updateUptime, 1000);
        });
    </script>
</body>
</html>
