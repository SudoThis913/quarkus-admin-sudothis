<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudoThis Admin - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            flex-direction: column;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .console-output {
            margin-top: 20px;
            background-color: #333;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            text-align: left;
            font-family: monospace;
            width: 80%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to SudoThis Admin</h1>
        <p class="lead">Your compliance-first, metadata-driven administration framework.</p>
        <a href="/admin" class="btn btn-primary btn-lg">Go to Admin Panel</a>
    </div>

    
</body>
</html>
