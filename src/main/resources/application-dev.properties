# SSL Configuration for Dev
quarkus.http.ssl-port=8443
quarkus.http.ssl.certificate.key-store-file=secrets/dev-keystore.p12
quarkus.http.ssl.certificate.key-store-password=changeit
quarkus.http.ssl.certificate.key-store-type=PKCS12

# In Dev, we redirect to HTTPS to simulate prod-like traffic
quarkus.http.insecure-requests=redirect

# Logging
quarkus.hibernate-orm.log.sql=true