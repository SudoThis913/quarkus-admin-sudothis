# ─── OIDC ─────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url = http://localhost:8180/realms/sudothis
quarkus.oidc.client-id        = sudothis-app
quarkus.oidc.tls.verification = none        # dev only

# Enable DevServices for Keycloak
quarkus.oidc.devservices.enabled = true                 # default = true in dev/test
quarkus.oidc.devservices.realm-path = keycloak-realm.json  # import this realm at startup

# ─── DataSource (MySQL 8) ─────────────────────────────────────────────
quarkus.datasource.devservices.image-name = mysql:8
quarkus.datasource.username = ${DB_USER:sudothis}
quarkus.datasource.password = ${DB_PASSWORD:secret}
quarkus.hibernate-orm.database.generation = update       # or validate / drop-and-create

# ─── Redis cache ──────────────────────────────────────────────────────
quarkus.redis.devservices.image-name = redis:7
quarkus.cache.caffeine.enabled = false        # disable local cache
quarkus.cache.redis.enabled = true            # use Redis as backing cache


# Redis
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver
quarkus.redis.hosts=redis://quarkus-redis:6379
quarkus.redis.password=${REDIS_PASSWORD:letmein}

# MySQL for IaC demo
%local.quarkus.datasource.db-kind=mysql
%local.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/quarkusdb
%local.quarkus.datasource.username=${DB_USER:admin}
%local.quarkus.datasource.password=${DB_PASSWORD:admin123}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver


# ─── HTTP port (keep tests/testcontainers happy) ─────────────────────
quarkus.http.port = 8081
