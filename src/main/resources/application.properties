# ─── OIDC ─────────────────────────────────────────────────────────────
quarkus.oidc.client-id        = sudothis-app
quarkus.oidc.tls.verification = none

# RP-initiated logout: the index page's Sign out button hits /logout, which
# clears the session cookie and ends the Keycloak SSO session (OIDC modes only)
quarkus.oidc.logout.path             = /logout
quarkus.oidc.logout.post-logout-path = /

# Keycloak carries realm roles in the access token (realm_access.roles);
# without this, code-flow sessions read the ID token and get no roles → 403
quarkus.oidc.roles.source = accesstoken

quarkus.oidc.devservices.realm-path = keycloak-realm.json

# ─── DataSource ───────────────────────────────────────────────────────
# Default values for DevServices or other generic settings
quarkus.datasource.username = ${DB_USER:sudothis}
quarkus.datasource.password = ${DB_PASSWORD:secret}
quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.log.sql = true

# ─── Redis cache ──────────────────────────────────────────────────────
# Default (Global): Redis with DevServices
quarkus.redis.devservices.image-name = redis:7
quarkus.cache.caffeine.enabled = false
quarkus.cache.redis.enabled = true

# ─── HTTP & Security Headers ──────────────────────────────────────────
quarkus.http.port = 8081
quarkus.http.test-port = 8083
quarkus.http.header."Content-Security-Policy".value = default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:;
quarkus.http.header."Cache-Control".value = no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0
quarkus.http.header."X-Content-Type-Options".value = nosniff
quarkus.http.header."X-Frame-Options".value = DENY

# Rest Client configuration
admin-data-api/mp-rest/url=${quarkus.http.port:8081}/
%test.admin-data-api/mp-rest/url=http://localhost:${quarkus.http.test-port}/

# ─── Environment Overrides ────────────────────────────────────────────

# %dev: Quarkus DevServices spins up MySQL + Redis + Keycloak automatically via Docker/Testcontainers.
# Do NOT set jdbc.url or jdbc.driver here — DevServices configures them automatically.
# Requires Docker Desktop to be running.
%dev.quarkus.datasource.db-kind = mysql
%dev.quarkus.datasource.devservices.image-name = mysql:8.0
%dev.quarkus.redis.devservices.image-name = redis:7

# %h2: No-Docker local dev — H2 + Caffeine + embedded users.
# Usage: ./mvnw quarkus:dev -Dquarkus.profile=h2
# Login at http://localhost:8081/admin with admin / admin123
%h2.quarkus.datasource.db-kind=h2
%h2.quarkus.datasource.jdbc.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=MySQL
%h2.quarkus.datasource.username=sa
%h2.quarkus.datasource.password=sa
%h2.quarkus.hibernate-orm.database.generation=drop-and-create
%h2.quarkus.cache.redis.enabled=false
%h2.quarkus.cache.caffeine.enabled=true
%h2.quarkus.oidc.enabled=false
%h2.quarkus.keycloak.devservices.enabled=false
%h2.quarkus.redis.devservices.enabled=false
%h2.quarkus.security.users.embedded.enabled=true
%h2.quarkus.security.users.embedded.plain-text=true
%h2.quarkus.security.users.embedded.users.admin=admin123
%h2.quarkus.security.users.embedded.roles.admin=admin,user
%h2.quarkus.http.auth.form.enabled=true
%h2.quarkus.http.auth.form.login-page=/login.html
%h2.quarkus.http.auth.form.error-page=/login.html
%h2.quarkus.smallrye-jwt.enabled=false

# %local: Matches Terraform "local" environment (External Docker Containers)
%local.quarkus.datasource.db-kind = mysql
%local.quarkus.datasource.jdbc.driver = com.mysql.cj.jdbc.Driver
%local.quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3307/quarkusdb
%local.quarkus.datasource.username = ${DB_USER:admin}
%local.quarkus.datasource.password = ${DB_PASSWORD:admin123}
%local.quarkus.redis.hosts = redis://localhost:6379
%local.quarkus.redis.password = ${REDIS_PASSWORD:letmein}
%local.quarkus.oidc.auth-server-url = http://localhost:8180/realms/sudothis

# %test: Use H2 In-Memory DB for tests (Avoids Docker dependency for CI/Test)
%test.quarkus.datasource.db-kind = h2
%test.quarkus.datasource.jdbc.driver = org.h2.Driver
%test.quarkus.datasource.jdbc.url = jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
%test.quarkus.datasource.username = sa
%test.quarkus.datasource.password = sa
%test.quarkus.hibernate-orm.database.generation = drop-and-create
%test.quarkus.redis.devservices.enabled = false
%test.quarkus.cache.redis.enabled = false
%test.quarkus.cache.caffeine.enabled = true
%test.quarkus.oidc.enabled = false
%test.quarkus.keycloak.devservices.enabled = false

# %prod: Production Settings (single-node Raspberry Pi deployment)
%prod.quarkus.datasource.db-kind = mysql
%prod.quarkus.datasource.jdbc.driver = com.mysql.cj.jdbc.Driver
%prod.quarkus.datasource.jdbc.url = ${JDBC_URL:jdbc:mysql://mysql:3306/quarkusdb}
%prod.quarkus.hibernate-orm.database.generation = update
%prod.quarkus.hibernate-orm.log.sql = false

# OIDC — auth server URL must be reachable by both the app container and the browser
%prod.quarkus.oidc.auth-server-url = ${OIDC_AUTH_SERVER_URL}
# sudothis-app is a public client — set QUARKUS_OIDC_CREDENTIALS_SECRET via env if it is ever made confidential
# hybrid: browser sessions use the code flow, API clients use bearer tokens
%prod.quarkus.oidc.application-type = ${OIDC_APP_TYPE:hybrid}

# Single-node: in-process Caffeine cache instead of Redis (2GB host, no Redis container)
%prod.quarkus.redis.devservices.enabled = false
%prod.quarkus.cache.redis.enabled = false
%prod.quarkus.cache.caffeine.enabled = true

# Structured JSON logs for aggregation; retention handled by Docker log rotation
%prod.quarkus.log.console.json = true
%prod.quarkus.log.console.json.exception-output-type = formatted