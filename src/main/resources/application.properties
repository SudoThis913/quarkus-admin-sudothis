# ─── OIDC ─────────────────────────────────────────────────────────────
quarkus.oidc.client-id        = sudothis-app
quarkus.oidc.tls.verification = none

# Enable DevServices for Keycloak
quarkus.oidc.devservices.enabled = true
quarkus.oidc.devservices.realm-path = keycloak-realm.json

# ─── DataSource ───────────────────────────────────────────────────────
# Default (Global): MySQL with DevServices (Testcontainers)
quarkus.datasource.db-kind = mysql
quarkus.datasource.username = ${DB_USER:sudothis}
quarkus.datasource.password = ${DB_PASSWORD:secret}
quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.log.sql = true
quarkus.datasource.jdbc.driver = com.mysql.cj.jdbc.Driver

# ─── Redis cache ──────────────────────────────────────────────────────
# Default (Global): Redis with DevServices
quarkus.redis.devservices.image-name = redis:7
quarkus.cache.caffeine.enabled = false
quarkus.cache.redis.enabled = true

# ─── Environment Overrides ────────────────────────────────────────────

# %local: Matches Terraform "local" environment (External Docker Containers)
%local.quarkus.datasource.jdbc.url = jdbc:mysql://localhost:3307/quarkusdb
%local.quarkus.datasource.username = ${DB_USER:admin}
%local.quarkus.datasource.password = ${DB_PASSWORD:admin123}
%local.quarkus.redis.hosts = redis://localhost:6379
%local.quarkus.redis.password = ${REDIS_PASSWORD:letmein}
%local.quarkus.oidc.auth-server-url = http://localhost:8180/realms/sudothis

# %test: Use H2 In-Memory DB for tests (Avoids Docker dependency for CI/Test)
%test.quarkus.datasource.db-kind = h2
%test.quarkus.datasource.jdbc.driver = org.h2.Driver
%test.quarkus.datasource.jdbc.url = jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
%test.quarkus.datasource.username = sa
%test.quarkus.datasource.password = sa
%test.quarkus.hibernate-orm.database.generation = drop-and-create
%test.quarkus.redis.devservices.enabled = false 
# Mock Redis or use simple cache for tests if possible, or let it fail gracefully?
# Actually, let's assume we don't need full Redis for basic Unit tests or mock it.
%test.quarkus.cache.redis.enabled = false
%test.quarkus.cache.caffeine.enabled = true

# %prod: Production Settings
%prod.quarkus.datasource.db-kind = mysql
# %prod.quarkus.oidc.auth-server-url will be injected via ENV vars in production

# ─── HTTP ─────────────────────────────────────────────────────────────
quarkus.http.port = 8081